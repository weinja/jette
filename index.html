<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eine wichtige Frage 🍦</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Quicksand', sans-serif;
    overflow-x: hidden;
}


/* =========================================================
   STARTSEITE
========================================================= */

.start-page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;

    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.35) 0 3px, transparent 4px),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,.25) 0 2px, transparent 3px),
        #f6b6c9;

    background-size: 80px 80px, 100px 100px;
}

.start-card {
    background: rgba(255,255,255,.80);
    backdrop-filter: blur(8px);
    padding: 50px 55px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(100,30,50,.15);
    max-width: 700px;
    width: 90%;
    position: relative;
    z-index: 10;
}

h1 {
    font-family: 'Baloo 2', cursive;
    font-size: 43px;
    line-height: 1.15;
    color: #741f32;
    margin: 0 0 12px;
}

.subtitle {
    font-size: 17px;
    color: #733847;
    margin-bottom: 30px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
}

.main-button {
    border: none;
    background: #791f32;
    color: white;
    padding: 13px 35px;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .2s;
}

.main-button:hover {
    transform: scale(1.06);
}

#noButton {
    position: relative;
}


/* Herzen */

.heart {
    position: absolute;
    color: rgba(130,30,55,.28);
    font-size: 28px;
    animation: wobble 3s ease-in-out infinite;
}

@keyframes wobble {

    0%,100% {
        transform: rotate(-8deg) translateY(0);
    }

    50% {
        transform: rotate(8deg) translateY(-12px);
    }

}


/* =========================================================
   EISSEITE
========================================================= */

.ice-page {
    display: none;
    min-height: 100vh;
    padding: 35px 20px 50px;

    background:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,.3) 0 3px, transparent 4px),
        radial-gradient(circle at 90% 80%, rgba(255,255,255,.25) 0 3px, transparent 4px),
        #f8c3d4;

    background-size: 80px 80px, 110px 110px;
}

.shop-title {
    text-align: center;
    font-family: 'Baloo 2', cursive;
    color: #741f32;
    font-size: 42px;
    margin: 0;
}

.shop-subtitle {
    text-align: center;
    color: #733847;
    margin: 0 0 30px;
}

.shop {
    max-width: 1150px;
    margin: auto;

    display: grid;
    grid-template-columns: 1fr 1.15fr;
    gap: 35px;
}


/* =========================================================
   EISSORTEN
========================================================= */

.flavor-box {
    background: rgba(255,255,255,.84);
    border-radius: 28px;
    padding: 25px;
    box-shadow: 0 15px 40px rgba(100,30,50,.12);
}

.flavor-box h2,
.build-box h2 {
    color: #741f32;
    font-family: 'Baloo 2', cursive;
    margin-top: 0;
}

.flavors {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 13px;
}

.flavor {
    border: none;
    border-radius: 18px;
    background: #fff;
    padding: 12px;
    cursor: pointer;
    box-shadow: 0 5px 12px rgba(0,0,0,.08);
    transition: transform .15s;
}

.flavor:hover {
    transform: translateY(-4px);
}

.flavor-ball {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    margin: auto;

    box-shadow:
        inset -7px -7px 10px rgba(0,0,0,.08),
        inset 6px 5px 8px rgba(255,255,255,.3),
        0 4px 7px rgba(0,0,0,.12);
}

.flavor-name {
    margin-top: 7px;
    font-weight: 700;
    color: #633340;
}


/* =========================================================
   EIS-ZUSAMMENBAU
========================================================= */

.build-box {
    background: rgba(255,255,255,.84);
    border-radius: 28px;
    padding: 25px;
    box-shadow: 0 15px 40px rgba(100,30,50,.12);
    text-align: center;
}

.ice-area {
    height: 520px;

    display: flex;
    justify-content: center;
    align-items: flex-end;

    position: relative;
}


/*
   DER KOMPLETTE EIS-AUFBAU

   Alles befindet sich innerhalb
   eines einzigen Containers.
*/

.ice-creation {
    width: 260px;
    height: 470px;
    position: relative;
}


/* =========================================================
   WAFFEL
========================================================= */

.cone {
    position: absolute;

    bottom: 0;
    left: 50%;

    transform: translateX(-50%);

    width: 150px;
    height: 245px;

    background:
        repeating-linear-gradient(
            45deg,
            rgba(120,75,30,.28) 0px,
            rgba(120,75,30,.28) 2px,
            transparent 2px,
            transparent 18px
        ),

        repeating-linear-gradient(
            -45deg,
            rgba(120,75,30,.25) 0px,
            rgba(120,75,30,.25) 2px,
            transparent 2px,
            transparent 18px
        ),

        linear-gradient(#e8ae58,#d9973d);

    clip-path: polygon(
        7% 0,
        93% 0,
        50% 100%
    );

    box-shadow:
        inset 0 0 15px rgba(100,50,10,.18);

    z-index: 3;
}


/* Waffelrand */

.cone-top {
    position: absolute;

    bottom: 218px;
    left: 50%;

    transform: translateX(-50%);

    width: 154px;
    height: 27px;

    border-radius: 50%;

    background: #eab25d;

    z-index: 4;
}


/* =========================================================
   EISKUGELN
========================================================= */

.scoops {
    position: absolute;

    bottom: 215px;
    left: 50%;

    transform: translateX(-50%);

    width: 220px;
    height: 210px;

    z-index: 6;
}


/*
   Jede Kugel bekommt automatisch
   eine Position innerhalb des Stapels.
*/

.scoop {
    position: absolute;

    width: 105px;
    height: 105px;

    border-radius: 50%;

    box-shadow:
        inset -12px -12px 18px rgba(0,0,0,.10),
        inset 10px 8px 14px rgba(255,255,255,.28),
        0 5px 8px rgba(80,30,30,.18);

    transition:
        bottom .35s ease,
        left .35s ease,
        transform .25s ease;

    z-index: 6;
}


/*
   1 Kugel
*/

.scoops .scoop:nth-child(1) {
    left: 57px;
    bottom: 0;
}


/*
   2 Kugeln
*/

.scoops .scoop:nth-child(2) {
    left: 12px;
    bottom: 48px;
}

.scoops .scoop:nth-child(2):last-child {
    left: 57px;
    bottom: 0;
}


/*
   3 Kugeln
*/

.scoops .scoop:nth-child(3) {
    left: 102px;
    bottom: 48px;
}


/*
   4 Kugeln
*/

.scoops .scoop:nth-child(4) {
    left: 35px;
    bottom: 96px;
}


/*
   5 Kugeln
*/

.scoops .scoop:nth-child(5) {
    left: 80px;
    bottom: 96px;
}


/* =========================================================
   AUTOMATISCHE TOPPING-POSITION
========================================================= */


/*
   1 KUGEL
*/

.scoops-1 .whipped-cream {
    bottom: 298px;
}

.scoops-1 .chocolate-sauce {
    bottom: 278px;
}

.scoops-1 .sprinkles {
    bottom: 293px;
}


/*
   2 KUGELN
*/

.scoops-2 .whipped-cream {
    bottom: 345px;
}

.scoops-2 .chocolate-sauce {
    bottom: 325px;
}

.scoops-2 .sprinkles {
    bottom: 340px;
}


/*
   3 KUGELN
*/

.scoops-3 .whipped-cream {
    bottom: 345px;
}

.scoops-3 .chocolate-sauce {
    bottom: 325px;
}

.scoops-3 .sprinkles {
    bottom: 340px;
}


/*
   4 KUGELN
*/

.scoops-4 .whipped-cream {
    bottom: 393px;
}

.scoops-4 .chocolate-sauce {
    bottom: 373px;
}

.scoops-4 .sprinkles {
    bottom: 388px;
}


/*
   5 KUGELN
*/

.scoops-5 .whipped-cream {
    bottom: 393px;
}

.scoops-5 .chocolate-sauce {
    bottom: 373px;
}

.scoops-5 .sprinkles {
    bottom: 388px;
}


/* =========================================================
   SAHNE
========================================================= */

.whipped-cream {
    position: absolute;

    left: 50%;

    transform: translateX(-50%);

    width: 105px;
    height: 110px;

    z-index: 15;

    pointer-events: none;

    transition: bottom .35s ease;
}


/* Sahne-Kleckse */

.cream-blob {
    position: absolute;

    background:
        radial-gradient(
            circle at 35% 25%,
            #ffffff 0%,
            #fffaf5 65%,
            #eee6df 100%
        );

    border-radius: 50%;

    box-shadow:
        inset -5px -5px 8px rgba(180,150,140,.12),
        0 3px 5px rgba(80,40,40,.12);
}


/* Sahne unten */

.cream-blob:nth-child(1) {
    width: 62px;
    height: 62px;

    left: 21px;
    bottom: 0;
}


/* links */

.cream-blob:nth-child(2) {
    width: 57px;
    height: 57px;

    left: 2px;
    bottom: 30px;
}


/* rechts */

.cream-blob:nth-child(3) {
    width: 57px;
    height: 57px;

    right: 2px;
    bottom: 30px;
}


/* Mitte */

.cream-blob:nth-child(4) {
    width: 50px;
    height: 50px;

    left: 28px;
    bottom: 57px;
}


/* Spitze */

.cream-blob:nth-child(5) {
    width: 37px;
    height: 37px;

    left: 34px;
    bottom: 75px;
}


/* =========================================================
   SCHOKOSOSSE
========================================================= */

.chocolate-sauce {
    position: absolute;

    left: 50%;

    transform: translateX(-50%);

    width: 135px;
    height: 100px;

    z-index: 16;

    pointer-events: none;

    transition: bottom .35s ease;
}


/* obere Soße */

.sauce-top {
    position: absolute;

    top: 12px;
    left: 5px;

    width: 125px;
    height: 38px;

    background:
        linear-gradient(
            180deg,
            #6d321c,
            #4b1d0f
        );

    border-radius: 50%;

    box-shadow:
        inset 0 4px 5px rgba(255,255,255,.08),
        0 3px 4px rgba(50,20,10,.18);
}


/* Tropfen */

.drip {
    position: absolute;

    top: 30px;

    background: linear-gradient(
        90deg,
        #4a1b0e,
        #63301a
    );

    border-radius:
        0 0 15px 15px;

    box-shadow:
        1px 2px 3px rgba(50,20,10,.15);
}


.drip:nth-child(2) {
    left: 16px;
    width: 19px;
    height: 31px;
}

.drip:nth-child(3) {
    left: 46px;
    width: 20px;
    height: 49px;
}

.drip:nth-child(4) {
    left: 80px;
    width: 18px;
    height: 27px;
}

.drip:nth-child(5) {
    right: 10px;
    width: 18px;
    height: 39px;
}


/* =========================================================
   STREUSEL
========================================================= */

.sprinkles {
    position: absolute;

    left: 50%;

    transform: translateX(-50%);

    width: 155px;
    height: 95px;

    z-index: 18;

    pointer-events: none;

    transition: bottom .35s ease;
}


.sprinkle {
    position: absolute;

    width: 7px;
    height: 20px;

    border-radius: 5px;

    box-shadow:
        0 1px 2px rgba(0,0,0,.15);
}


/* einzelne Streusel */

.sprinkle:nth-child(1) {
    left: 18px;
    top: 25px;
    transform: rotate(30deg);
    background: #d44b62;
}

.sprinkle:nth-child(2) {
    left: 40px;
    top: 10px;
    transform: rotate(-25deg);
    background: #4c7dce;
}

.sprinkle:nth-child(3) {
    left: 65px;
    top: 22px;
    transform: rotate(55deg);
    background: #e5a72e;
}

.sprinkle:nth-child(4) {
    left: 92px;
    top: 8px;
    transform: rotate(-45deg);
    background: #5ca85c;
}

.sprinkle:nth-child(5) {
    left: 120px;
    top: 25px;
    transform: rotate(20deg);
    background: #d44b62;
}

.sprinkle:nth-child(6) {
    left: 135px;
    top: 48px;
    transform: rotate(-30deg);
    background: #e5a72e;
}

.sprinkle:nth-child(7) {
    left: 32px;
    top: 50px;
    transform: rotate(65deg);
    background: #9b62c8;
}

.sprinkle:nth-child(8) {
    left: 57px;
    top: 52px;
    transform: rotate(-15deg);
    background: #4c7dce;
}

.sprinkle:nth-child(9) {
    left: 83px;
    top: 48px;
    transform: rotate(40deg);
    background: #e56b35;
}

.sprinkle:nth-child(10) {
    left: 108px;
    top: 57px;
    transform: rotate(-50deg);
    background: #5ca85c;
}

.sprinkle:nth-child(11) {
    left: 48px;
    top: 70px;
    transform: rotate(25deg);
    background: #d44b62;
}

.sprinkle:nth-child(12) {
    left: 78px;
    top: 70px;
    transform: rotate(-40deg);
    background: #e5a72e;
}


/* =========================================================
   TOPPING-BUTTONS
========================================================= */

.toppings {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 5px;
}

.topping-button {
    border: 2px solid #b85a70;
    background: white;
    color: #743143;

    padding: 10px 15px;

    border-radius: 999px;

    font-weight: 700;

    cursor: pointer;

    transition: .2s;
}

.topping-button:hover {
    transform: translateY(-2px);
}

.topping-button.active {
    background: #791f32;
    color: white;
}


/* =========================================================
   BEZAHLEN
========================================================= */

.pay-button {
    margin-top: 20px;

    border: none;

    padding: 14px 35px;

    border-radius: 999px;

    background: #791f32;
    color: white;

    font-size: 18px;
    font-weight: 700;

    cursor: pointer;

    opacity: .4;

    transition: .2s;
}

.pay-button.enabled {
    opacity: 1;
}

.pay-button.enabled:hover {
    transform: scale(1.04);
}


/* =========================================================
   ZAHLUNG
========================================================= */

.payment-overlay {
    position: fixed;

    inset: 0;

    background: rgba(90,20,40,.55);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 100;
}

.payment-card {
    background: white;

    padding: 45px;

    border-radius: 25px;

    text-align: center;
}

.spinner {
    width: 55px;
    height: 55px;

    border: 6px solid #f1ccd6;
    border-top-color: #791f32;

    border-radius: 50%;

    animation: spin 1s linear infinite;

    margin: 0 auto 20px;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =========================================================
   FINALE
========================================================= */

.final-page {
    display: none;

    min-height: 100vh;

    align-items: center;
    justify-content: center;

    text-align: center;

    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.3) 0 3px, transparent 4px),
        #f6b6c9;
}

.final-card {
    background: rgba(255,255,255,.85);

    padding: 55px;

    border-radius: 30px;

    box-shadow: 0 20px 50px rgba(100,30,50,.15);
}

.final-card h1 {
    font-size: 50px;
}

.final-card p {
    font-size: 22px;
    color: #743143;
}


/* =========================================================
   HANDY
========================================================= */

@media(max-width: 800px) {

    .shop {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 32px;
    }

    .shop-title {
        font-size: 34px;
    }

}

</style>
</head>

<script>


/* =========================================================
   STARTSEITE
========================================================= */

const startPage =
    document.getElementById("startPage");

const icePage =
    document.getElementById("icePage");

const finalPage =
    document.getElementById("finalPage");

const yesButton =
    document.getElementById("yesButton");

const noButton =
    document.getElementById("noButton");


yesButton.addEventListener("click", () => {

    startPage.style.display = "none";

    icePage.style.display = "block";

});


noButton.addEventListener("mouseenter", () => {

    const maxX =
        window.innerWidth -
        noButton.offsetWidth -
        30;

    const maxY =
        window.innerHeight -
        noButton.offsetHeight -
        30;

    const x =
        Math.random() * maxX;

    const y =
        Math.random() * maxY;

    noButton.style.position = "fixed";

    noButton.style.left =
        x + "px";

    noButton.style.top =
        y + "px";

});



/* =========================================================
   EISSORTEN
========================================================= */

const flavors =
    document.querySelectorAll(".flavor");

const flavorBalls =
    document.querySelectorAll(".flavor-ball");


/*
   Sicherheitshalber setzen wir die Farben
   der kleinen Kugeln noch einmal automatisch.
*/

flavors.forEach(flavor => {

    const color =
        flavor.dataset.color;

    const ball =
        flavor.querySelector(".flavor-ball");

    ball.style.background =
        color;


    /*
       Klick auf eine Eissorte
    */

    flavor.addEventListener("click", () => {

        addScoop(color);

    });

});



/* =========================================================
   EISKUGELN
========================================================= */

const scoopsContainer =
    document.getElementById("scoops");

const iceCreation =
    document.getElementById("iceCreation");

let scoopCount = 0;


function addScoop(color) {

    /*
       maximal 5 Kugeln
    */

    if (scoopCount >= 5) {
        return;
    }


    const scoop =
        document.createElement("div");

    scoop.className =
        "scoop";


    /*
       Farbe der gewählten Eissorte
    */

    scoop.style.background =
        color;


    /*
       Kleine zufällige Drehung,
       damit es nicht komplett künstlich aussieht.
    */

    const rotation =
        Math.random() * 8 - 4;

    scoop.style.transform =
        `rotate(${rotation}deg)`;


    scoopsContainer.appendChild(
        scoop
    );


    scoopCount++;


    /*
       Jetzt wird geprüft,
       wie hoch das Eis ist.
    */

    updateIcePosition();


    updatePayButton();

}



/* =========================================================
   AUTOMATISCHE TOPPING-POSITION
========================================================= */

function updateIcePosition() {


    /*
       Alte Klassen entfernen
    */

    iceCreation.classList.remove(
        "scoops-1",
        "scoops-2",
        "scoops-3",
        "scoops-4",
        "scoops-5"
    );


    /*
       Neue Klasse passend zur
       Kugelanzahl hinzufügen.
    */

    if (scoopCount > 0) {

        iceCreation.classList.add(
            `scoops-${scoopCount}`
        );

    }

}



/* =========================================================
   SAHNE
========================================================= */

const creamButton =
    document.getElementById("creamButton");

const creamContainer =
    document.getElementById("creamContainer");

let creamActive = false;


creamButton.addEventListener("click", () => {


    /*
       Ohne Eis keine Sahne.
    */

    if (scoopCount === 0) {
        return;
    }


    creamActive =
        !creamActive;


    creamButton.classList.toggle(
        "active",
        creamActive
    );


    if (creamActive) {


        creamContainer.innerHTML = `

            <div class="whipped-cream">

                <div class="cream-blob"></div>

                <div class="cream-blob"></div>

                <div class="cream-blob"></div>

                <div class="cream-blob"></div>

                <div class="cream-blob"></div>

            </div>

        `;

    } else {

        creamContainer.innerHTML = "";

    }

});

/* =========================================================
   BEZAHLEN
========================================================= */

const payButton =
    document.getElementById("payButton");

const paymentOverlay =
    document.getElementById("paymentOverlay");


function updatePayButton() {

    if (scoopCount > 0) {

        payButton.classList.add(
            "enabled"
        );

    } else {

        payButton.classList.remove(
            "enabled"
        );

    }

}


payButton.addEventListener("click", () => {


    if (scoopCount === 0) {
        return;
    }


    paymentOverlay.style.display =
        "flex";


    setTimeout(() => {


        paymentOverlay.style.display =
            "none";


        icePage.style.display =
            "none";


        finalPage.style.display =
            "flex";


    }, 2200);

});
